name: Build

env:
  BUILDS_BRANCH: builds

concurrency:
  group: build
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: debian-trixie-node22

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 ca-certificates

      - name: Checkout
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          HOST="${SERVER#*://}"
          git clone --branch main \
            "https://x-access-token:${TOKEN}@${HOST}/${REPO}.git" .

      - name: Copy providers into scrapers
        run: python3 tools/sync_scrapers.py
        continue-on-error: true

      - name: Check whether anything changed
        id: diff
        run: |
          if [ -s /tmp/sync-changed.txt ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refresh sources.lock.json and validate
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 tools/lock_sources.py
          python3 tools/validate_sources.py
          python3 tools/lock_sources.py --check
          npm install --no-save --ignore-scripts acorn@8.14.0
          node tools/lint_js.mjs
          bash tools/no_webview_guard.sh

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          GIT_NAME: ${{ secrets.COMMIT_NAME || 'eclipsia-bot' }}
          GIT_EMAIL: ${{ secrets.COMMIT_EMAIL || vars.COMMIT_EMAIL || 'eclipsia-bot@noreply.codefloe.com' }}
        run: |
          git config --local user.name "$GIT_NAME"
          git config --local user.email "$GIT_EMAIL"
          git add eclipsia
          git diff --cached --quiet && exit 0
          git commit -m "Sync scrapers [skip ci]" -m "$(cat /tmp/sync-changed.txt)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if some providers are missing or invalid
        run: |
          if [ -s /tmp/sync-failures.txt ]; then
            echo "Problems:"; cat /tmp/sync-failures.txt; exit 1
          fi

  build:
    needs: sync
    # amd64 only (Android build tools don't run on the arm64 runners); node22 is preinstalled
    runs-on: debian-trixie-node22

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 zip unzip rsync curl ca-certificates

      - name: Checkout
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          HOST="${SERVER#*://}"
          git clone --branch main \
            "https://x-access-token:${TOKEN}@${HOST}/${REPO}.git" src

      - name: Validate Gradle wrapper
        uses: https://github.com/gradle/actions/wrapper-validation@v5

      - name: Checkout builds branch
        env:
          TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          HOST="${SERVER#*://}"
          git clone --branch "$BUILDS_BRANCH" \
            "https://x-access-token:${TOKEN}@${HOST}/${REPO}.git" builds

      - name: Clean builds branch (keep only .git)
        run: find "$GITHUB_WORKSPACE/builds" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate assets and hash lock
        run: |
          cd "$GITHUB_WORKSPACE/src"
          python3 tools/validate_sources.py
          python3 tools/lock_sources.py --check

      - name: Checks (lint, no-WebView guard, Node shim conformance)
        run: |
          cd "$GITHUB_WORKSPACE/src"
          npm install --no-save --ignore-scripts acorn@8.14.0
          node tools/lint_js.mjs
          bash tools/no_webview_guard.sh
          node test/node/eclipsia/shim_test.js
          node test/node/eclipsia/shim_api_test.js
          node test/node/soryn/soryn_test.js
          node test/node/playz/shim_api_test.js
          node test/node/playz/playz_test.js

      - name: JVM unit tests
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew -I playz/gradle/include-playz.init.gradle.kts testDebugUnitTest

      - name: Build Plugins
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew -I playz/gradle/include-playz.init.gradle.kts make makePluginsJson
          python3 tools/check_cs3.py $(find . -name "*.cs3")
          find . -name "*.cs3" | while read -r f; do
            cp "$f" "$GITHUB_WORKSPACE/builds/$(basename "$f" | tr '[:upper:]' '[:lower:]')"
          done
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"

      - name: Copy icons
        run: |
          mkdir -p "$GITHUB_WORKSPACE/builds/icons"
          cp -r "$GITHUB_WORKSPACE/src/icons/." "$GITHUB_WORKSPACE/builds/icons/"

      - name: Copy repo.json
        run: cp "$GITHUB_WORKSPACE/src/repo.json" "$GITHUB_WORKSPACE/builds/repo.json"

      - name: Point plugins.json at Codefloe
        env:
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          BASE_OVERRIDE: ${{ vars.PLUGIN_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, re
          repo_url = os.environ["SERVER"].rstrip("/") + "/" + os.environ["REPO"]
          pages_base = "https://eclipsia.codefloe.page/cloudstream"
          raw = (os.environ.get("BASE_OVERRIDE") or "").rstrip("/") or pages_base
          icons_base = pages_base + "/icons/"
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "builds", "plugins.json")
          data = json.load(open(path))
          for p in data:
              p["url"] = raw + "/" + re.sub(r".*/", "", p["url"]).lower()
              p["repositoryUrl"] = repo_url
              if p.get("iconUrl"):
                  p["iconUrl"] = icons_base + p["iconUrl"].rsplit("/", 1)[-1]
          json.dump(data, open(path, "w"), indent=4, ensure_ascii=False)
          print("\n".join(p["url"] + "\n  " + p.get("iconUrl", "") for p in data))
          PY

      - name: Push builds
        env:
          GIT_NAME: ${{ secrets.COMMIT_NAME  || 'eclipsia-bot' }}
          GIT_EMAIL: ${{ secrets.COMMIT_EMAIL || 'eclipsia-bot@noreply.codefloe.com' }}
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.name "$GIT_NAME"
          git config --local user.email "$GIT_EMAIL"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build $GITHUB_SHA"
          git push origin "HEAD:${BUILDS_BRANCH}"